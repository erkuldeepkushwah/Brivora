name: Deploy Expert Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Discover Cloudflare account
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "--- tokens/verify:"
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CF_TOKEN"
          echo
          echo "--- /user:"
          curl -s "https://api.cloudflare.com/client/v4/user" -H "Authorization: Bearer $CF_TOKEN"
          echo
          echo "--- /accounts raw:"
          curl -s "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CF_TOKEN"
          echo
