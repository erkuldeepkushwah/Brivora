name: Fix mobile nav and card links
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply changes
        run: node scripts/fix-nav-and-links.mjs
      - name: Type check
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet || (git commit -m "Add working mobile menu and fix Learn more / card links" && git push)
