name: Login page in contact form theme
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix script and apply changes
        run: |
          node scripts/fix-b64.mjs
          node scripts/apply-login-theme.mjs
      - name: Type check
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts/apply-login-theme.mjs
          git diff --cached --quiet || (git commit -m "Rebuild login page in the contact form theme (card + wpcf7-style fields + working submit)" && git push)
