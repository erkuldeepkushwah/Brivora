name: Course system
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wire course page and rebuild dashboards
        run: |
          node scripts/wire-course-page.mjs
          node scripts/build-admin-v2.mjs
          node scripts/build-dashboard-v2.mjs
      - name: Seed initial courses (only if database is empty)
        run: |
          EXISTING=$(curl -s "https://career-68877-default-rtdb.firebaseio.com/brivora_courses.json")
          if [ "$EXISTING" = "null" ] || [ -z "$EXISTING" ]; then
            curl -s -X PUT -H "Content-Type: application/json" -d @scripts/seed-courses.json "https://career-68877-default-rtdb.firebaseio.com/brivora_courses.json"
            echo "seeded initial courses"
          else
            echo "courses already exist, skipping seed"
          fi
      - name: Type check
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts/templates
          git diff --cached --quiet || (git commit -m "Course system: dynamic public page + admin course management" && git push)
