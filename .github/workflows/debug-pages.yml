name: Debug Pages

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Pages projects
        env:
          CF_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          ACC: c94324f165a02453d105634b561329f3
        run: |
          echo "--- pages projects:"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" | jq .
