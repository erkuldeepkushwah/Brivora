name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Write static-export next.config.mjs (build only, not committed)
        run: |
          cat > next.config.mjs << 'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: "export",
            basePath: "/Brivora",
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF
          git diff --stat next.config.mjs || true
      - name: Build static site
        run: npx next build
      - name: Post-process paths for /Brivora base
        run: |
          cat > process.js << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const BP = "/Brivora";
          function walk(d) {
            return fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
          }
          for (const f of walk("out")) {
            if (f.endsWith(".html")) {
              let s = fs.readFileSync(f, "utf8");
              s = s.replace(/(href|src|poster)="\/public\//g, `$1="${BP}/`);
              s = s.replace(/(href|src|poster)='\/public\//g, `$1='${BP}/`);
              s = s.replace(/(href|src|poster)="\/(?!\/|Brivora\/|#)/g, `$1="${BP}/`);
              s = s.replace(/(href|src|poster)='\/(?!\/|Brivora\/|#)/g, `$1='${BP}/`);
              s = s.replace(/url\((["']?)\/(?!\/|Brivora\/)/g, `url($1${BP}/`);
              fs.writeFileSync(f, s);
            }
            if (f.endsWith("nav-links.js")) {
              let s = fs.readFileSync(f, "utf8");
              s = s.replace(/: '\/(?!\/|Brivora\/)/g, `: '${BP}/`);
              s = s.replace(/['"]\/public\/logo\.png['"]/g, `"${BP}/logo.png"`);
              fs.writeFileSync(f, s);
            }
          }
          console.log("post-processed for GitHub Pages basePath");
          EOF
          node process.js
      - name: Restore original next.config.mjs (never commit the export config)
        run: git checkout -- next.config.mjs || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
