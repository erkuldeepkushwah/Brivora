name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          if [ -d Brivora/altes ]; then npm install parse5 --no-save --no-audit --no-fund; fi
      - name: Generate TSX pages from HTML
        run: |
          if [ -d Brivora/altes ]; then
            node scripts/convert-nextjs.mjs
          else
            echo "Brivora/altes not found - using committed TSX pages"
          fi
      - name: Type check
        run: npx tsc --noEmit
      - name: Commit generated pages
        if: ${{ hashFiles('Brivora/altes/*.html') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet || (git commit -m "Generate Next.js TSX pages from Brivora/altes HTML" && git push)
      - name: Build static site
        run: npx next build
      - name: Fix asset paths for GitHub Pages
        run: |
          cat > fixpaths.js << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const BP = "/Brivora";
          const pageMap = {
            "/about": "/about/",
            "/blog": "/blog/",
            "/contact": "/contact/",
            "/course": "/course/",
            "/courses": "/course/",
            "/login": "/login/",
            "/signin": "/login/",
            "/logs": "/logs/",
            "/logos": "/logs/",
            "/service": "/service/",
            "/services": "/service/",
            "/our-services": "/service/",
            "/case-studies": "/case-studies/",
            "/home": "/",
            "/home1": "/",
            "/home-page-1": "/",
            "/home-2": "/",
          };
          function walk(d) {
            return fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
          }
          for (const f of walk("out")) {
            if (f.endsWith(".html")) {
              let s = fs.readFileSync(f, "utf8");
              for (const [route, dest] of Object.entries(pageMap)) {
                s = s.split('href="' + route + '"').join('href="' + BP + dest + '"');
                s = s.split('href="' + route + '/"').join('href="' + BP + dest + '"');
              }
              s = s.replace(/(href|src|poster)="\/(?!\/|Brivora\/|#)/g, '$1="' + BP + '/');
              s = s.replace(/(href|src|poster)='\/(?!\/|Brivora\/|#)/g, "$1='" + BP + "/");
              s = s.replace(/url\((["']?)\/(?!\/|Brivora\/)/g, "url($1" + BP + "/");
              fs.writeFileSync(f, s);
            }
            if (f.endsWith("nav-links.js")) {
              let s = fs.readFileSync(f, "utf8");
              for (const [route, dest] of Object.entries(pageMap)) {
                s = s.split(": '" + route + "'").join(": '" + BP + dest + "'");
              }
              s = s.replace(/: '\/(?!\/|Brivora\/)/g, ": '" + BP + "/");
              fs.writeFileSync(f, s);
            }
          }
          console.log("paths fixed");
          EOF
          node fixpaths.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
