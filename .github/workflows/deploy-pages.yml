name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          if [ -d Brivora/altes ]; then npm install parse5 --no-save --no-audit --no-fund; fi
      - name: Generate TSX pages from HTML
        run: |
          if [ -d Brivora/altes ]; then
            node scripts/convert-nextjs.mjs
          else
            echo "Brivora/altes not found - using committed TSX pages"
          fi
      - name: Type check
        run: npx tsc --noEmit
      - name: Commit generated pages
        if: ${{ hashFiles('Brivora/altes/*.html') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet || (git commit -m "Generate Next.js TSX pages from Brivora/altes HTML" && git push)
      - name: Build static site
        run: npx next build
      - name: Fix links and strip hydration scripts
        run: |
          cat > fixpaths.js << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const BP = "/Brivora";
          const t7 = "https://the7.io/fse-business";
          const pageMap = {
            "/about": "/about/",
            "/blog": "/blog/",
            "/contact": "/contact/",
            "/course": "/course/",
            "/courses": "/course/",
            "/login": "/login/",
            "/signin": "/login/",
            "/logs": "/logs/",
            "/logos": "/logs/",
            "/service": "/services/",
            "/services": "/services/",
            "/our-services": "/services/",
            "/case-studies": "/case-studies/",
            "/home": "/",
            "/home1": "/",
            "/home-page-1": "/",
            "/home-2": "/",
          };
          const navMap = {
            "/home": "/",
            "/home-page-1": "/",
            "/home-2": "/",
            "/about": "/about/",
            "/services": "/services/",
            "/our-services": "/services/",
            "/case-studies": "/case-studies/",
            "/cases-studies-02": "/case-studies/",
            "/case-studies-03": "/case-studies/",
            "/more/case-cards": "/course/",
            "/case-cards": "/course/",
            "/course": "/course/",
            "/courses": "/course/",
            "/login": "/login/",
            "/blog": "/blog/",
            "/blog02": "/blog/",
            "/contact": "/contact/",
            "/contact02": "/contact/",
            "/more/logos": "/logs/",
            "/logos": "/logs/",
          };
          const prefixMap = [
            ["/services/", "/services/"],
            ["/case-studies", "/case-studies/"],
            ["/blog", "/blog/"],
            ["/contact", "/contact/"],
            ["/about", "/about/"],
            ["/course", "/course/"],
          ];
          function esc(x) {
            return x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          }
          function walk(d) {
            return fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
          }
          for (const f of walk("out")) {
            if (f.endsWith(".html")) {
              let s = fs.readFileSync(f, "utf8");
              // 1. internal routes (root-relative hrefs in JSX)
              for (const [route, dest] of Object.entries(pageMap)) {
                s = s.split('href="' + route + '"').join('href="' + BP + dest + '"');
                s = s.split('href="' + route + '/"').join('href="' + BP + dest + '"');
              }
              // 2. the7.io menu links -> local routes (exact matches)
              for (const [route, dest] of Object.entries(navMap)) {
                s = s.split('href="' + t7 + route + '"').join('href="' + BP + dest + '"');
                s = s.split('href="' + t7 + route + '/"').join('href="' + BP + dest + '"');
              }
              s = s.split('href="' + t7 + '"').join('href="' + BP + '/"');
              s = s.split('href="' + t7 + '/"').join('href="' + BP + '/"');
              // 3. the7.io links by prefix (service detail links etc.)
              for (const [prefix, dest] of prefixMap) {
                s = s.replace(new RegExp('href="' + esc(t7 + prefix) + '[^"]*"', "g"), 'href="' + BP + dest + '"');
              }
              // 4. other root-relative asset paths
              s = s.replace(/(href|src|poster)="\/(?!\/|Brivora\/|#)/g, '$1="' + BP + '/');
              s = s.replace(/(href|src|poster)='\/(?!\/|Brivora\/|#)/g, "$1='" + BP + "/");
              s = s.replace(/url\((["']?)\/(?!\/|Brivora\/)/g, "url($1" + BP + "/");
              // 5. strip Next.js hydration scripts so React cannot revert baked links
              s = s.replace(/<script[^>]*src="[^"]*_next\/static\/[^"]*"[^>]*><\/script>/g, "");
              // 6. drop script preloads (no longer needed)
              s = s.replace(/<link[^>]*rel="preload"[^>]*as="script"[^>]*\/?>/g, "");
              s = s.replace(/<link[^>]*as="script"[^>]*rel="preload"[^>]*\/?>/g, "");
              fs.writeFileSync(f, s);
            }
            if (f.endsWith("nav-links.js")) {
              let s = fs.readFileSync(f, "utf8");
              for (const [route, dest] of Object.entries(pageMap)) {
                s = s.split(": '" + route + "'").join(": '" + BP + dest + "'");
              }
              s = s.replace(/: '\/(?!\/|Brivora\/)/g, ": '" + BP + "/");
              fs.writeFileSync(f, s);
            }
          }
          console.log("links baked, hydration scripts stripped");
          EOF
          node fixpaths.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
