name: Convert pages to JSX
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install --no-save parse5
          npm install --no-audit --no-fund
      - name: Convert pages to real JSX
        run: node scripts/convert-to-jsx.js
      - name: Type check (must pass before commit)
        run: npx tsc --noEmit
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert pages to real JSX markup in page.tsx"
          git push
