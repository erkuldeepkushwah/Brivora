name: Self-host Firebase SDK (fix 405)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-host SDK + rebuild pages
        run: |
          node scripts/selfhost-sdk.mjs
          node scripts/update-login-redirect.mjs
          node scripts/build-admin-v2.mjs
          node scripts/build-dashboard-v2.mjs
          node scripts/fix-405-guard.mjs
      - name: Type check
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app public scripts/templates
          git diff --cached --quiet || (git commit -m "Self-host Firebase SDK locally + 405 submit guard" && git push)
