name: Retheme dashboards
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild pages with site theme
        run: |
          node scripts/update-login-redirect.mjs
          node scripts/build-admin-v2.mjs
          node scripts/build-dashboard-v2.mjs
          node scripts/fix-405-guard.mjs
          node scripts/wire-course-page.mjs
          node scripts/build-auth-pages.mjs
          node scripts/patch-team-photos.mjs
          node scripts/patch-hero-image.mjs
      - name: Optimize images
        run: |
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y imagemagick
          fi
          IMG=convert; command -v convert >/dev/null 2>&1 || IMG=magick
          $IMG public/1.jpeg -resize 800x -quality 82 public/team-1.jpg
          $IMG public/2.jpeg -resize 800x -quality 82 public/team-2.jpg
          $IMG public/3.jpeg -resize 800x -quality 82 public/team-3.jpg
          $IMG public/4.jpeg -resize 800x -quality 82 public/team-4.jpg
          $IMG public/8.png  -resize 800x -quality 82 public/team-5.jpg
          $IMG public/9.png  -resize 800x -quality 82 public/team-6.jpg
          $IMG public/6.png  -resize '1024x>' -quality 72 public/hero.webp
      - name: Type check
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts/templates public/team-*.jpg public/hero.webp
          git diff --cached --quiet || (git commit -m "Retheme dashboards to Brivora site theme" && git push)
