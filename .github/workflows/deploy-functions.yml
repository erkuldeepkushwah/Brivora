name: Deploy Firebase functions
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write and validate Firebase service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret MISSING. GitHub repo > Settings > Secrets and variables > Actions > New repository secret. Name: FIREBASE_SERVICE_ACCOUNT. Value: the FULL JSON file from Firebase Console > Project settings > Service accounts > Generate new private key."
            exit 1
          fi
          printf '%s' "$SA" > /tmp/firebase-key.json
          if ! jq -e . /tmp/firebase-key.json > /dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Make sure you pasted the ENTIRE file content (from { to }), exactly as downloaded."
            exit 1
          fi
          if ! jq -e 'has("private_key") and has("client_email") and has("project_id")' /tmp/firebase-key.json > /dev/null; then
            echo "::error::Service account JSON is missing private_key / client_email / project_id. This does not look like a service-account key file."
            exit 1
          fi
          echo "Service account OK for project: $(jq -r .project_id /tmp/firebase-key.json)"
      - name: Write functions .env from secrets
        env:
          ADMIN_EMAIL: ${{ secrets.BRIVORA_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BRIVORA_ADMIN_PASSWORD }}
        run: |
          printf 'ADMIN_EMAIL=%s\nADMIN_PASSWORD=%s\n' "$ADMIN_EMAIL" "$ADMIN_PASSWORD" > functions/.env
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Deploy functions
        run: firebase deploy --only functions --project career-68877
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
