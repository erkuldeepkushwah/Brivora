name: Deploy Firebase functions
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json
      - name: Write functions .env from secrets
        run: |
          printf 'ADMIN_EMAIL=%s\nADMIN_PASSWORD=%s\n' "${{ secrets.BRIVORA_ADMIN_EMAIL }}" "${{ secrets.BRIVORA_ADMIN_PASSWORD }}" > functions/.env
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Deploy functions
        run: firebase deploy --only functions --project career-68877
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
